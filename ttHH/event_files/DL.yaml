# ttHH dileptonic event topology.
# Companion to SL.yaml: both tops decay leptonically (lt1, lt2), plus
# the two Higgses (each H -> bb). lt1 / lt2 are symmetric under
# exchange, h1 / h2 are symmetric under exchange, and each Higgs's
# two b's are symmetric internally. No hadronic top, so no q1 / q2.

INPUTS:
  SEQUENTIAL:
    Momenta:
      mass: log_normalize
      pt: log_normalize
      eta: normalize

      sin_phi: none
      cos_phi: none

      btag: none

      # Per-jet pair-summary features (from draft/producers/pair_features.py).
      # Each value is in jet i's slot but is computed from i's b-tagged
      # partners, so SPANet's per-jet attention sees a different value
      # in every slot -- unlike a GLOBAL scalar, which has no jet identity.
      m_partner_drmin: log_normalize   # m_ij with the b-tagged j closest in ΔR
      dR_partner_min:  normalize       # ΔR(i, that closest b-tagged j)
      m_closest_125:   log_normalize   # m_ij minimising |m_ij - 125|
      m_closest_91:    log_normalize   # m_ij minimising |m_ij - 91|
      n_partner_higgs: none            # count of b-tag partners with m_ij in 125 ± 25

      # Per-jet invariant mass m(jet, lepton), min and max over the 2 leptons.
      # A top b (with its lepton) sits below the endpoint sqrt(m_t^2 - m_W^2)
      # = 152.75 GeV; a Higgs b runs higher. Raw mass in GeV -> log_normalize
      # (like the other mass features).
      m_lep_min: log_normalize
      m_lep_max: log_normalize

    # Selected leptons (combined muons + electrons, sorted by pT desc).
    # DL events have exactly 2 real entries; SL events have 1. Adding
    # this collection lets the assignment head correlate each leptonic
    # top's b-jet with its lepton -- the missing input that capped
    # Lt Purity in 2lt2h events at 0.44 in the no-lepton training.
    # `is_mu`: 1 = muon, 0 = electron. `charge`: lepton sign, written
    # as float for SPANet vector_float compat.
    Lep:
      pt: log_normalize
      eta: normalize
      sin_phi: none
      cos_phi: none
      charge: none
      is_mu: none

  GLOBAL:
    Met:
      met: log_normalize
      sin_phi: none
      cos_phi: none
    HT:
      ht: log_normalize


EVENT:
  lt1:
    - b: Momenta
    - lep: Lep

  lt2:
    - b: Momenta
    - lep: Lep

  h1:
    - b1: Momenta
    - b2: Momenta

  h2:
    - b1: Momenta
    - b2: Momenta


PERMUTATIONS:
    EVENT:
      - [ lt1, lt2 ]
      - [ h1,  h2  ]
    h1:
      - [ b1, b2 ]
    h2:
      - [ b1, b2 ]


REGRESSIONS:
  EVENT:
    - neutrino1_eta
    - neutrino1_px
    - neutrino1_py
    - neutrino1_pz
    - neutrino2_eta
    - neutrino2_px
    - neutrino2_py
    - neutrino2_pz
    - log_invariant_mass


CLASSIFICATIONS:
  EVENT:
    - signal
    - process_class     # 5-class super-group; one-word revert -> process_id
