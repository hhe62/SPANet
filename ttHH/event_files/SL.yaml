# ttHH semi-leptonic event topology.
# Adapted from event_files/semi_leptonic_ttH.yaml: 1 hadronic top + 1
# leptonic top + 2 Higgses, each H -> bb. The two Higgses are symmetric
# under exchange, and each Higgs's two b's are symmetric internally.

INPUTS:
  SEQUENTIAL:
    Momenta:
      mass: log_normalize
      pt: log_normalize
      eta: normalize

      sin_phi: none
      cos_phi: none

      btag: none

      # Per-jet pair-summary features (from draft/producers/pair_features.py).
      # Each value is in jet i's slot but is computed from i's b-tagged
      # partners, so SPANet's per-jet attention sees a different value
      # in every slot -- unlike a GLOBAL scalar, which has no jet identity.
      m_partner_drmin: log_normalize   # m_ij with the b-tagged j closest in ΔR
      dR_partner_min:  normalize       # ΔR(i, that closest b-tagged j)
      m_closest_125:   log_normalize   # m_ij minimising |m_ij - 125|
      m_closest_91:    log_normalize   # m_ij minimising |m_ij - 91|
      n_partner_higgs: none            # count of b-tag partners with m_ij in 125 ± 25

      # Per-jet endpoint asymmetry (m - a)/(m + a) of m(jet, lepton), with
      # a = sqrt(m_t^2 - m_W^2) = 152.75 GeV: a top b (with its lepton) is < 0,
      # a Higgs b can exceed 0, bounded to (-1, 1). `none` keeps 0 at the
      # endpoint. SL has 1 lepton, so min == max -- only m_lep_min is listed.
      m_lep_min: none

    # Selected leptons (combined muons + electrons, sorted by pT desc).
    # SL events have exactly 1 real entry. Adding this collection lets
    # the assignment head correlate lt.b with the lepton -- the missing
    # input that the no-lepton training had no way to use.
    # `is_mu`: 1 = muon, 0 = electron. `charge`: lepton sign, written
    # as float for SPANet vector_float compat.
    Lep:
      pt: log_normalize
      eta: normalize
      sin_phi: none
      cos_phi: none
      charge: none
      is_mu: none

  GLOBAL:
    Met:
      met: log_normalize
      sin_phi: none
      cos_phi: none
    HT:
      ht: log_normalize


EVENT:
  lt:
    - b: Momenta
    - lep: Lep

  ht:
    - b:  Momenta
    - q1: Momenta
    - q2: Momenta

  h1:
    - b1: Momenta
    - b2: Momenta

  h2:
    - b1: Momenta
    - b2: Momenta


PERMUTATIONS:
    EVENT:
      - [ h1, h2 ]
    ht:
      - [ q1, q2 ]
    h1:
      - [ b1, b2 ]
    h2:
      - [ b1, b2 ]


REGRESSIONS:
  EVENT:
    - neutrino_eta
    - neutrino_px
    - neutrino_py
    - neutrino_pz
    - log_invariant_mass


CLASSIFICATIONS:
  EVENT:
    - signal
    - process_class     # 5-class super-group; one-word revert -> process_id
