# ttHH semi-leptonic event topology.
# Adapted from event_files/semi_leptonic_ttH.yaml: 1 hadronic top + 1
# leptonic top + 2 Higgses, each H -> bb. The two Higgses are symmetric
# under exchange, and each Higgs's two b's are symmetric internally.

INPUTS:
  SEQUENTIAL:
    Momenta:
      mass: log_normalize
      pt: log_normalize
      eta: normalize

      sin_phi: normalize
      cos_phi: normalize

      qtag: none
      btag: none
      etag: none
      utag: none

  GLOBAL:
    Met:
      met: log_normalize
      sin_phi: normalize
      cos_phi: normalize


EVENT:
  lt:
    - b

  ht:
    - b
    - q1
    - q2

  h1:
    - b1
    - b2

  h2:
    - b1
    - b2


PERMUTATIONS:
    EVENT:
      - [ h1, h2 ]
    ht:
      - [ q1, q2 ]
    h1:
      - [ b1, b2 ]
    h2:
      - [ b1, b2 ]


REGRESSIONS:
  # EVENT:
  #   - neutrino_eta
  #   - neutrino_px
  #   - neutrino_py
  #   - neutrino_pz
  #   - log_invariant_mass


CLASSIFICATIONS:
  EVENT:
    - signal
